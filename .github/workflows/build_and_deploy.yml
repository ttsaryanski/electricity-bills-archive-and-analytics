name: Deploy PowerTrack to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      forced_target_color:
        description: "Deployment target color (auto, blue, green)"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - blue
          - green

concurrency:
  group: powertrack-deploy-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_CLERK_SIGN_IN_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
            NEXT_PUBLIC_CLERK_SIGN_UP_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_URL }}
            NEXT_PUBLIC_CLERK_SIGN_IN_FORCE_REDIRECT_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_FORCE_REDIRECT_URL }}
            NEXT_PUBLIC_CLERK_SIGN_UP_FORCE_REDIRECT_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_FORCE_REDIRECT_URL }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/powertrack_key
          printf '%s\n' "${{ secrets.POWERTRACK_SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/powertrack_key

      - name: Add host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.POWERTRACK_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare Ansible Vault password
        run: |
          printf '%s' "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > ~/.ansible_vault_pass
          chmod 600 ~/.ansible_vault_pass

      - name: Deploy with Ansible
        working-directory: infra/ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "True"
          ANSIBLE_ROLES_PATH: ./roles
        run: |
          TARGET_COLOR="${{ github.event.inputs.forced_target_color || 'auto' }}"

          ansible-playbook -i inventory.ini playbooks/site-docker.yml \
            --private-key ~/.ssh/powertrack_key \
            --vault-password-file ~/.ansible_vault_pass \
            -e "ansible_ssh_private_key_file=/home/runner/.ssh/powertrack_key" \
            --extra-vars "image_tag=${{ github.sha }} domain_name=${{ secrets.POWERTRACK_DOMAIN }} admin_email=${{ secrets.POWERTRACK_ADMIN_EMAIL }} forced_target_color=${TARGET_COLOR}"
          
        # ansible-playbook -i inventory.ini playbooks/site.yml \
        #   --private-key ~/.ssh/powertrack_key \
        #   --vault-password-file ~/.ansible_vault_pass \
        #   -e "ansible_ssh_private_key_file=/home/runner/.ssh/powertrack_key" \
        #   --extra-vars "repo_url=https://github.com/${{ github.repository }}.git repo_branch=${{ github.ref_name }} app_base_dir=${{ secrets.POWERTRACK_APP_DIR }} domain_name=${{ secrets.POWERTRACK_DOMAIN }} admin_email=${{ secrets.POWERTRACK_ADMIN_EMAIL }} forced_target_color=${TARGET_COLOR}"